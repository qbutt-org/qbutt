[package]
name = "qbutt-content"
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-or-later"
publish = false

[features]
download-fixture = []

[[example]]
name = "downloads"
required-features = ["download-fixture"]

[dependencies]
base64 = "=0.22.1"
cookie_store = { version = "=0.22.1", default-features = false }
encoding_rs = "=0.8.35"
roxmltree = "=0.21.1"
rbook = { version = "=0.7.12", default-features = false }
zip = { version = "=9.0.1", default-features = false, features = ["deflate"] }
getrandom = "=0.4.3"
httparse = "=1.10.1"
percent-encoding = "=2.3.2"
reqwest = { version = "0.12.24", default-features = false, features = ["rustls-tls"] }
ring = "=0.17.14"
rusqlite = { version = "=0.40.2", default-features = false, features = ["bundled"] }
scraper = { version = "=0.27.0", default-features = false }
sha2 = "=0.10.9"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
thiserror = "2.0.17"
subtle = "=2.6.1"
time = "=0.3.55"
tokio = { version = "1.48.0", features = ["fs", "io-util", "net", "process", "rt", "time", "sync", "macros"] }
url = { version = "2.5.7", features = ["serde"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "=0.61.2", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_Storage_FileSystem",
    "Win32_System_Threading",
] }

[dev-dependencies]
rcgen = { version = "=0.14.10", default-features = false, features = ["ring"] }
tokio = { version = "1.48.0", features = ["macros", "rt-multi-thread"] }
tokio-rustls = { version = "=0.26.6", default-features = false, features = ["ring", "tls12"] }
