[package]
name = "qbutt_quick"
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-or-later"
publish = false

[lib]
crate-type = ["staticlib"]

[dependencies]
cxx = "=1.0.205"
cxx-qt = "=0.10.0"
cxx-qt-lib = { version = "=0.10.0", features = ["qt_qml"] }
qbutt-content = { path = "../../../content" }
qbutt-codex = { path = "../../../../crates/codex-client" }
reqwest = { version = "0.12.24", default-features = false, features = ["rustls-tls"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
sha2 = "=0.10.9"
tempfile = "=3.27.0"
tokio = { version = "1.48.0", features = ["fs", "io-util", "macros", "process", "rt-multi-thread", "sync", "time"] }
url = "2.5.7"

[build-dependencies]
cxx-qt-build = "=0.10.0"
