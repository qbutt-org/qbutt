name: Build Windows

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: '1.4.0'
      - name: Build portable application
        shell: pwsh
        run: ./scripts/build-windows.ps1 -BuildRoot "$env:RUNNER_TEMP/qbutt-build" -DependencyRoot "$env:RUNNER_TEMP/qbutt-dependencies"
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: qbutt-windows-x64
          if-no-files-found: error
          path: |
            ${{ runner.temp }}/qbutt-build/qbutt-windows-x64.zip
            ${{ runner.temp }}/qbutt-build/qbutt.pdb
            ${{ runner.temp }}/qbutt-build/compile_commands.json
