name: Build Windows

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build portable application
        shell: pwsh
        run: ./scripts/build-windows.ps1 -BuildRoot "$env:RUNNER_TEMP/qbutt-build" -DependencyRoot "$env:RUNNER_TEMP/qbutt-dependencies"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: qbutt-windows-x64
          if-no-files-found: error
          path: |
            ${{ runner.temp }}/qbutt-build/qbutt-windows-x64.zip
            ${{ runner.temp }}/qbutt-build/qbutt.pdb
            ${{ runner.temp }}/qbutt-build/compile_commands.json
