# Friendlier playback behavior
save-position-on-quit=yes
keep-open=yes
idle=yes
force-window=yes
window-maximized=yes
osd-bar=yes
osd-align-x=left
osd-align-y=top

# ModernX replaces mpv's minimal built-in controller.
osc=no

# Keep HTTPS verification available on Windows installations with an incomplete root store.
tls-verify=yes
tls-ca-file=~~/certs/cacert.pem
