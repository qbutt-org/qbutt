[package]
name = "framegen-manager"
version = "0.1.0"
description = "Frame generation runtime installer for mpv-config"
edition = "2024"
license = "MIT"
publish = false

[lib]
name = "framegen_manager_lib"

[[bin]]
name = "framegen-manager"
path = "src/main.rs"

[dependencies]
anyhow = "1.0.99"
clap = { version = "4.5.45", features = ["derive"] }
hex = "0.4.3"
reqwest = { version = "0.12.23", default-features = false, features = ["blocking", "rustls-tls"] }
sevenz-rust2 = { version = "0.21.4", default-features = false, features = ["util"] }
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.143"
sha2 = "0.10.9"
tempfile = "3.21.0"
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_Storage_FileSystem", "Win32_System_Diagnostics_ToolHelp", "Win32_System_LibraryLoader"] }
zip = { version = "4.6.1", default-features = false, features = ["deflate"] }

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62.2", features = ["Win32_Foundation", "Win32_Graphics_Dxgi"] }

[dev-dependencies]
assert_fs = "1.1.3"
sevenz-rust2 = { version = "0.21.4", default-features = false, features = ["compress", "util"] }
